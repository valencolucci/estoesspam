<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" aria-label="Logo SPAM">
  <defs>
    <!-- Gradiente de luz amarilla de la lampara -->
    <linearGradient id="luzLampara" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Cuadro de mensaje (speech bubble) superior -->
  <g id="cuadro-mensaje">
    <rect x="12" y="8" width="58" height="26" rx="4" fill="#121212" />
    <polygon points="24,34 32,34 22,42" fill="#121212" />
    <!-- Líneas de texto simuladas en el mensaje -->
    <line x1="20" y1="17" x2="48" y2="17" stroke="#FFE600" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="24" x2="60" y2="24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Lámpara que ilumina -->
  <g id="lampara" transform="translate(68, 6)">
    <!-- Brazo / soporte -->
    <path d="M 0,22 Q 12,6 26,12" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round" />
    <!-- Pantalla / foco de la lámpara -->
    <path d="M 24,8 L 36,16 L 31,24 L 20,16 Z" fill="#121212" />
    <circle cx="28" cy="18" r="4" fill="#FFE600" />
    <!-- Cono de luz proyectado hacia el nombre -->
    <polygon points="32,20 180,68 60,68" fill="url(#luzLampara)" />
  </g>

  <!-- Nombre del medio: SPAM -->
  <text x="96" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5" fill="#121212">
    SPAM
  </text>

  <!-- Punto de atención / alerta -->
  <circle cx="236" cy="52" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
</svg>
